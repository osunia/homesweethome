<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>둥지 프로젝트</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --deep-green: #123226;
      --forest-green: #2F4A3A;
      --mocha-brown: #8B6F4E;
      --oat-beige: #E9DEC8;
      --charcoal: #2B2B2B;
      --card-bg: #F7F3EB;
      --zone-bg: #EFE8D8;
      --capsule-bg: #FCFBF8;
      --border: #CFC3AC;
      --border-strong: #B5A68C;
      --text-sub: #665E52;
      --danger: #8C3B32;
      --danger-soft: #F3E4E1;
      --dup-red: #A63A32;
      --dup-bg: #FAE6E4;
      --radius: 2px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    *::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--oat-beige);
      color: var(--charcoal);
      line-height: 1.5;
      padding-top: 114px;
      padding-bottom: 48px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 58px;
      background: var(--deep-green);
      border-bottom: 2px solid var(--mocha-brown);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
      box-shadow: 0 2px 10px rgba(18, 50, 38, 0.15);
    }
    .brand {
      font-family: 'Gowun Batang', serif;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--oat-beige);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-tag {
      font-family: "Pretendard", sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 6px;
      background: var(--forest-green);
      color: var(--oat-beige);
      border: 1px solid var(--mocha-brown);
      border-radius: var(--radius);
      letter-spacing: 0.8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sync-badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: var(--radius);
      background: var(--forest-green);
      border: 1px solid rgba(233, 222, 200, 0.25);
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--oat-beige);
    }
    .refresh-btn {
      background: var(--forest-green);
      color: var(--oat-beige);
      border: 1px solid rgba(233, 222, 200, 0.25);
      border-radius: var(--radius);
      padding: 3px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .refresh-btn:hover {
      background: var(--mocha-brown);
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #84B082; }
    .dot.syncing { background: #E0A96D; animation: blink 1s infinite; }
    .dot.error { background: #D96B59; }
    @keyframes blink { 50% { opacity: 0.25; } }

    nav.tab-bar {
      position: fixed;
      top: 58px; left: 0; right: 0;
      height: 48px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-strong);
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      z-index: 99;
    }
    .tab-btn {
      flex: 1;
      max-width: 220px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.86rem;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: -0.2px;
    }
    .tab-btn:hover {
      color: var(--deep-green);
      background: var(--zone-bg);
    }
    .tab-btn.active {
      background: var(--forest-green);
      color: var(--oat-beige);
      border-color: var(--deep-green);
      box-shadow: inset 0 -2px 0 var(--mocha-brown);
    }

    main { max-width: 1200px; margin: 0 auto; padding: 12px; }
    .tab-section { display: none; }
    .tab-section.active { display: block; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-strong);
      gap: 8px;
      flex-wrap: wrap;
    }
    .toolbar-title {
      font-family: 'Gowun Batang', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--deep-green);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--mocha-brown);
    }

    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 6px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--card-bg);
      color: var(--charcoal);
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--zone-bg); }
    .btn.primary {
      background: var(--forest-green);
      color: var(--oat-beige);
      border-color: var(--deep-green);
    }
    .btn.primary:hover { background: var(--deep-green); }
    .btn.dup-active {
      background: var(--dup-red);
      color: #fff;
      border-color: #7A251F;
    }
    .btn.manage-active {
      background: var(--mocha-brown);
      color: #fff;
      border-color: var(--charcoal);
    }
    .btn.danger {
      color: var(--danger);
      border-color: #C99E99;
      background: var(--danger-soft);
    }

    .mode-banner {
      display: none;
      margin-bottom: 12px;
      padding: 8px 12px;
      background: var(--dup-bg);
      border: 1px solid #D9A5A0;
      border-left: 4px solid var(--dup-red);
      border-radius: var(--radius);
      color: var(--dup-red);
      font-size: 0.82rem;
      font-weight: 600;
    }
    body.dup-mode .mode-banner { display: block; }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-top: 3px solid var(--deep-green);
      border-radius: var(--radius);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 3px 0 rgba(43, 43, 43, 0.04);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      gap: 8px;
    }
    .space-title-input {
      font-family: 'Gowun Batang', serif;
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 2px 4px;
      width: 100%;
      color: var(--deep-green);
      background: transparent;
      transition: all 0.15s;
    }
    .space-title-input:focus {
      outline: none;
      border-color: var(--mocha-brown);
      background: var(--capsule-bg);
    }

    .manage-controls {
      display: none;
      gap: 4px;
      flex-shrink: 0;
    }
    body.manage-mode .manage-controls { display: flex; }
    .icon-btn {
      padding: 4px 8px;
      font-size: 0.76rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--zone-bg);
      color: var(--charcoal);
      cursor: pointer;
      font-weight: 700;
    }
    .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .compare-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      transition: grid-template-columns 0.25s ease;
}
    .compare-box:has(> .zone-box:first-child.add-mode),
    .compare-box:has(> .zone-box:first-child.del-mode) {
      grid-template-columns: 2.2fr 1fr;
    }

    .compare-box:has(> .zone-box:last-child.add-mode),
    .compare-box:has(> .zone-box:last-child.del-mode) {
      grid-template-columns: 1fr 2.2fr;
    }
    .zone-box {
      background: transparent;
      border: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }
    .compare-box > .zone-box:first-child {
      padding-right: 10px;
    }
    .compare-box > .zone-box:last-child {
      padding-left: 10px;
      border-left: 1px solid var(--border);
    }

    .zone-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
      border-bottom: 1px dashed var(--border);
    }

    .person-label {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius);
      letter-spacing: 0.5px;
    }
    .label-kkomal { background: var(--forest-green); color: var(--oat-beige); }
    .label-kkamgo { background: var(--mocha-brown); color: #FCFBF8; }
    .label-neutral { background: var(--deep-green); color: var(--oat-beige); }

    .zone-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .pm-btn {
      width: 24px;
      height: 24px;
      border: 1px solid var(--border-strong);
      background: var(--capsule-bg);
      color: var(--charcoal);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: all 0.12s;
    }
    .pm-btn:hover {
      border-color: var(--deep-green);
      background: #fff;
    }
    .pm-btn.active-add {
      background: var(--forest-green);
      color: var(--oat-beige);
      border-color: var(--deep-green);
    }
    .pm-btn.active-del {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .capsule-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 30px;
      align-content: flex-start;
    }
    .empty-hint {
      font-size: 0.76rem;
      color: var(--text-sub);
      padding: 2px 0;
      font-style: italic;
    }
    .capsule {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--capsule-bg);
      border: 1px solid var(--border);
      border-left: 3px solid var(--forest-green);
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--charcoal);
      user-select: none;
      transition: all 0.12s;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(43, 43, 43, 0.03);
    }
    .zone-kkamgo .capsule { border-left-color: var(--mocha-brown); }
    .zone-neutral .capsule { border-left-color: var(--deep-green); }

    .capsule.is-dup {
      background: var(--dup-bg);
      border-color: #D4958F;
      border-left: 3px solid var(--dup-red);
      color: #7A221B;
      font-weight: 600;
    }
    .capsule.is-dup::after {
      content: "중복";
      font-size: 0.66rem;
      font-weight: 700;
      padding: 1px 4px;
      margin-left: 2px;
      background: var(--dup-red);
      color: #fff;
      border-radius: var(--radius);
    }
    body.dup-mode #tab-compare .capsule {
      cursor: pointer;
    }
    body.dup-mode #tab-compare .capsule:hover {
      border-color: var(--dup-red);
      transform: translateY(-1px);
    }

    .add-mode .capsule {
      cursor: pointer;
    }
    .add-mode .capsule:hover {
      border-color: var(--forest-green);
      background: #fff;
    }
    .add-mode .capsule.editing {
      background: #E4ECE7;
      border: 1px solid var(--forest-green);
      border-left: 3px solid var(--deep-green);
      color: var(--deep-green);
      font-weight: 700;
    }

    .del-mode .capsule {
      cursor: pointer;
      border: 1px dashed var(--mocha-brown);
      border-left: 3px solid var(--mocha-brown);
    }
    .del-mode .capsule::before {
      content: "☐";
      font-size: 0.78rem;
      color: var(--text-sub);
    }
    .del-mode .capsule.selected {
      background: var(--danger-soft);
      border: 1px solid var(--danger);
      border-left: 3px solid var(--danger);
      color: var(--danger);
      font-weight: 600;
    }
    .del-mode .capsule.selected::before {
      content: "☑";
      color: var(--danger);
    }

    .add-bar {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 2px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-strong);
    }

    .add-bar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end; 
    }
    .edit-hint {
      font-size: 0.72rem;
      color: var(--text-sub);
    }
    .add-input {
      flex: 1 1 100%; 
      min-width: 0;
      padding: 7px 8px; 
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font-size: 0.85rem;
      background: var(--capsule-bg);
      color: var(--charcoal);
    }
    .add-input:focus {
      outline: none;
      border-color: var(--deep-green);
      background: #fff;
    }

    .del-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      padding: 5px 8px;
      background: var(--danger-soft);
      border: 1px solid #C99E99;
      border-radius: var(--radius);
      font-size: 0.76rem;
      color: var(--danger);
      font-weight: 500;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 50, 38, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      width: 100%;
      max-width: 360px;
      background: var(--card-bg);
      border: 1px solid var(--border-strong);
      border-top: 4px solid var(--deep-green);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 12px 28px rgba(18, 50, 38, 0.25);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: modalFadeIn 0.15s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-title {
      font-family: 'Gowun Batang', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--deep-green);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .modal-message {
      font-size: 0.88rem;
      color: var(--charcoal);
      line-height: 1.55;
      word-break: keep-all;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>둥지 프로젝트</span>
      <span class="brand-tag">2027.01.25</span>
    </div>
    <div class="header-right">
      <div class="sync-badge">
        <span class="dot" id="syncDot"></span>
        <span id="syncText">준비됨</span>
      </div>
      <button class="refresh-btn" title="지금 즉시 동기화" onclick="manualSync()">↻</button>
    </div>
  </header>
  
  <nav class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('principles', this)">이삿짐 원칙</button>
    <button class="tab-btn" onclick="switchTab('compare', this)">공간별 짐 비교</button>
    <button class="tab-btn" onclick="switchTab('buy', this)">새로 구입할 짐</button>
  </nav>

  <main>
    <section id="tab-principles" class="tab-section active">
      <div class="toolbar">
        <div class="toolbar-title">이삿짐 꾸리기 원칙</div>
      </div>
      <div class="grid-container" id="principlesGrid"></div>
    </section>

    <section id="tab-compare" class="tab-section">
      <div class="toolbar">
        <div class="toolbar-title">공간별 짐 비교</div>
        <div class="btn-group">
          <button class="btn" onclick="addSpace()">+</button>
          <button class="btn" id="dupBtn" onclick="toggleDupMode()">중복 표시</button>
          <button class="btn" id="manageBtn" onclick="toggleManageMode()">⚙️</button>
        </div>
      </div>
      <div class="mode-banner">
        꼬말/깜고의 품목을 누르면 붉은 중복 라벨이 표시되거나 해제됩니다.
      </div>
      <div class="grid-container" id="compareGrid"></div>
    </section>

    <section id="tab-buy" class="tab-section">
      <div class="toolbar">
        <div class="toolbar-title">새로 구입해야 할 가구·짐</div>
      </div>
      <div class="grid-container" id="buyGrid"></div>
    </section>
  </main>

  <div class="modal-overlay" id="customModal" onclick="if(event.target===this) closeModal()">
    <div class="modal-box">
      <div class="modal-title" id="modalTitle">확인</div>
      <div class="modal-message" id="modalMessage"></div>
      <div class="modal-actions">
        <button class="btn" id="modalCancelBtn" onclick="closeModal()">취소</button>
        <button class="btn danger" id="modalConfirmBtn" onclick="handleModalConfirm()">확인</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKj05_crWX1-XVSK1HZIuwyKrZEeAXJiNSOQbDf6ufTS4olgImHcDt0u95VNV6zU0x/exec";

    const STORAGE_KEY = 'MOVING_PLANNER_CAPSULE_V4';
    const POLL_INTERVAL_MS = 5000; 

    let syncTimer = null;
    let pollTimer = null;
    let isSyncing = false;
    let hasPendingLocalChanges = false;
    let isManageMode = false;
    let isDupMode = false;
    let modalConfirmCallback = null;
    const uiState = {};

    function makeUid(prefix = 'id') {
      return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 7);
    }

    function makeDeterministicId(seedStr) {
      let hash = 0;
      for (let i = 0; i < seedStr.length; i++) {
        hash = ((hash << 5) - hash) + seedStr.charCodeAt(i);
        hash |= 0;
      }
      return 'init_' + Math.abs(hash).toString(36);
    }

    const defaultData = {
      _rev: 0,
      deletedIds: [],
      principles: [
        { id: 'p1', title: '1. 기본 이사 조건', updatedAt: 1, items: [] },
        { id: 'p2', title: '2. 짐 정리 핵심 원칙', updatedAt: 1, items: [] },
        { id: 'p3', title: '3. 출발지에서 폐기할 때', updatedAt: 1, items: [] }
      ],
      spaces: []
    };

    function toItemObjects(arr, prefixSeed = 'item') {
      if (!Array.isArray(arr)) return [];
      return arr.map((item, idx) => {
        if (typeof item === 'string') {
          return {
            uid: makeDeterministicId(prefixSeed + '_' + idx + '_' + item),
            text: item,
            dup: false,
            updatedAt: 1
          };
        }
        if (item && typeof item === 'object') {
          const textVal = String(item.text || '');
          return {
            uid: item.uid || makeDeterministicId(prefixSeed + '_' + idx + '_' + textVal),
            text: textVal,
            dup: Boolean(item.dup),
            updatedAt: Number(item.updatedAt || 1)
          };
        }
        return null;
      }).filter(x => x && x.text);
    }

    function normalizeData(data) {
      if (!data || !Array.isArray(data.principles) || !Array.isArray(data.spaces)) {
        return JSON.parse(JSON.stringify(defaultData));
      }
      data._rev = Number(data._rev || 0);
      data.deletedIds = Array.isArray(data.deletedIds) ? data.deletedIds : [];

      data.principles.forEach((p, idx) => {
        p.id = p.id || ('p' + (idx + 1));
        p.updatedAt = Number(p.updatedAt || 1);
        if (!Array.isArray(p.items)) {
          const lines = p.content ? p.content.split('\n').map(s => s.replace(/^[•\-]\s*/, '').trim()).filter(Boolean) : [];
          p.items = toItemObjects(lines, p.id);
          delete p.content;
        } else {
          p.items = toItemObjects(p.items, p.id);
        }
      });

      data.spaces.forEach((s, idx) => {
        s.id = s.id || ('s' + (idx + 1));
        s.updatedAt = Number(s.updatedAt || 1);
        ['kkomal', 'kkamgo', 'toBuy'].forEach(k => {
          if (!Array.isArray(s[k])) {
            const lines = typeof s[k] === 'string'
              ? s[k].split('\n').map(line => line.replace(/^[•\-]\s*/, '').trim()).filter(Boolean)
              : [];
            s[k] = toItemObjects(lines, s.id + '_' + k);
          } else {
            s[k] = toItemObjects(s[k], s.id + '_' + k);
          }
        });
      });
      return data;
    }

    function mergeItemArrays(localArr, remoteArr, deletedSet) {
      const map = new Map();
      const order = [];

      (remoteArr || []).forEach(item => {
        if (!item || !item.uid || deletedSet.has(item.uid)) return;
        map.set(item.uid, { ...item });
        order.push(item.uid);
      });

      (localArr || []).forEach(item => {
        if (!item || !item.uid || deletedSet.has(item.uid)) return;
        if (!map.has(item.uid)) {
          const existingSameText = Array.from(map.values()).find(x => x.text === item.text);
          if (existingSameText) {
            if ((item.updatedAt || 0) > (existingSameText.updatedAt || 0)) {
              existingSameText.dup = item.dup;
              existingSameText.updatedAt = item.updatedAt;
            }
            return;
          }
          map.set(item.uid, { ...item });
          order.push(item.uid);
        } else {
          const rem = map.get(item.uid);
          if ((item.updatedAt || 0) >= (rem.updatedAt || 0)) {
            map.set(item.uid, { ...item });
          }
        }
      });

      return order.map(uid => map.get(uid)).filter(Boolean);
    }

    function mergeAppData(local, remote) {
      if (!remote || !Array.isArray(remote.spaces)) return normalizeData(local);
      local = normalizeData(local);
      remote = normalizeData(remote);

      const deletedSet = new Set([...(remote.deletedIds || []), ...(local.deletedIds || [])]);

      const pMap = new Map();
      const pOrder = [];
      remote.principles.forEach(p => {
        if (deletedSet.has(p.id)) return;
        pMap.set(p.id, p);
        pOrder.push(p.id);
      });
      local.principles.forEach(p => {
        if (deletedSet.has(p.id)) return;
        if (!pMap.has(p.id)) {
          pMap.set(p.id, p);
          pOrder.push(p.id);
        } else {
          const remP = pMap.get(p.id);
          const newerTitle = (p.updatedAt || 0) >= (remP.updatedAt || 0) ? p.title : remP.title;
          pMap.set(p.id, {
            id: p.id,
            title: newerTitle,
            updatedAt: Math.max(p.updatedAt || 0, remP.updatedAt || 0),
            items: mergeItemArrays(p.items, remP.items, deletedSet)
          });
        }
      });

      const sOrder = [];
      const localOrderTime = local._orderUpdatedAt || 0;
      const remoteOrderTime = remote._orderUpdatedAt || 0;
      const primarySpaces = localOrderTime >= remoteOrderTime ? local.spaces : remote.spaces;
      const secondarySpaces = localOrderTime >= remoteOrderTime ? remote.spaces : local.spaces;

      primarySpaces.forEach(s => {
        if (!deletedSet.has(s.id) && !sOrder.includes(s.id)) sOrder.push(s.id);
      });
      secondarySpaces.forEach(s => {
        if (!deletedSet.has(s.id) && !sOrder.includes(s.id)) sOrder.push(s.id);
      });

      const localSpaceMap = new Map(local.spaces.map(s => [s.id, s]));
      const remoteSpaceMap = new Map(remote.spaces.map(s => [s.id, s]));

      const mergedSpaces = sOrder.map(id => {
        const locS = localSpaceMap.get(id);
        const remS = remoteSpaceMap.get(id);
        if (locS && remS) {
          const newerName = (locS.updatedAt || 0) >= (remS.updatedAt || 0) ? locS.name : remS.name;
          return {
            id,
            name: newerName,
            updatedAt: Math.max(locS.updatedAt || 0, remS.updatedAt || 0),
            kkomal: mergeItemArrays(locS.kkomal, remS.kkomal, deletedSet),
            kkamgo: mergeItemArrays(locS.kkamgo, remS.kkamgo, deletedSet),
            toBuy: mergeItemArrays(locS.toBuy, remS.toBuy, deletedSet)
          };
        }
        return locS || remS;
      }).filter(Boolean);

      return {
        _rev: Math.max(local._rev || 0, remote._rev || 0),
        _orderUpdatedAt: Math.max(localOrderTime, remoteOrderTime),
        deletedIds: Array.from(deletedSet).slice(-300),
        principles: pOrder.map(id => pMap.get(id)).filter(Boolean),
        spaces: mergedSpaces
      };
    }

    let appData = loadLocalData();

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      fetchFromSheet(true);
      startAutoPolling();
    });

    window.addEventListener('focus', () => {
      if (!isUserTyping() && !isSyncing) {
        fetchFromSheet(false);
      }
    });

    function startAutoPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(() => {
        if (isUserTyping() || hasPendingLocalChanges || isSyncing) return;
        fetchFromSheet(false);
      }, POLL_INTERVAL_MS);
    }

    function isUserTyping() {
      const active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
        return true;
      }
      return Object.values(uiState).some(st => st.addOpen || st.delMode);
    }

    function loadLocalData() {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('MOVING_PLANNER_CAPSULE_V3') || localStorage.getItem('MOVING_PLANNER_CAPSULE_V2');
      if (raw) {
        try { return normalizeData(JSON.parse(raw)); } catch (e) { console.error(e); }
      }
      return JSON.parse(JSON.stringify(defaultData));
    }

    function recordDeletion(id) {
      if (!id) return;
      if (!Array.isArray(appData.deletedIds)) appData.deletedIds = [];
      if (!appData.deletedIds.includes(id)) {
        appData.deletedIds.push(id);
      }
    }

    function saveData() {
      hasPendingLocalChanges = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      setSyncStatus('syncing', '저장 대기...');

      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        syncWithServer();
      }, 650);
    }

    function manualSync() {
      if (syncTimer) clearTimeout(syncTimer);
      syncWithServer(true);
    }

    function setSyncStatus(state, text) {
      const dot = document.getElementById('syncDot');
      const label = document.getElementById('syncText');
      dot.className = 'dot ' + (state === 'syncing' ? 'syncing' : state === 'error' ? 'error' : '');
      label.textContent = text;
    }

    function isValidGasUrl() {
      return GAS_URL && GAS_URL.startsWith('https://script.google.com/') && !GAS_URL.includes('여기에_배포');
    }
    
    async function fetchFromSheet(showLoading = false) {
      if (!isValidGasUrl() || isSyncing) return;
      if (showLoading) setSyncStatus('syncing', '불러오는 중...');

      try {
        const res = await fetch(GAS_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        if (text && text.trim().startsWith('{')) {
          const parsed = JSON.parse(text);

          if (parsed && parsed.data === null && parsed.rev === 0) {
            await syncWithServer();
            return;
          }

          const remoteData = normalizeData(parsed);
          const beforeStr = JSON.stringify({ p: appData.principles, s: appData.spaces });

          if (!appData._rev || appData._rev === 0) {
            appData = remoteData;
          } else {
            appData = mergeAppData(appData, remoteData);
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

          const afterStr = JSON.stringify({ p: appData.principles, s: appData.spaces });
          if (beforeStr !== afterStr && !isUserTyping()) {
            renderAll();
          }
          setSyncStatus('ok', '동기화됨');
        } else {
          await syncWithServer();
        }
      } catch (err) {
        console.error(err);
        if (showLoading) setSyncStatus('error', '오프라인 모드');
      }
    }

    async function syncWithServer(forceRender = false) {
      if (!isValidGasUrl()) {
        setSyncStatus('ok', '로컬 저장됨');
        hasPendingLocalChanges = false;
        return;
      }
      if (isSyncing) return;
      isSyncing = true;
      setSyncStatus('syncing', '동기화 중...');

      try {
        const getRes = await fetch(GAS_URL + '?t=' + Date.now(), { cache: 'no-store' });
        const getText = await getRes.text();
        if (getText && getText.trim().startsWith('{')) {
          const remoteParsed = JSON.parse(getText);
          if (!(remoteParsed && remoteParsed.data === null && remoteParsed.rev === 0)) {
            appData = mergeAppData(appData, remoteParsed);
          }
        }

        appData._rev = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));

        await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(appData)
        });

        hasPendingLocalChanges = false;
        if (!isUserTyping() || forceRender) {
          renderAll();
        }
        setSyncStatus('ok', '동기화됨');
      } catch (err) {
        console.error(err);
        setSyncStatus('error', '로컬 저장됨');
      } finally {
        isSyncing = false;
      }
    }

    function getZoneState(zoneKey) {
      if (!uiState[zoneKey]) {
        uiState[zoneKey] = {
          addOpen: false,
          editIdx: null,
          delMode: false,
          selected: new Set()
        };
      }
      return uiState[zoneKey];
    }

    function resetAllModes() {
      isManageMode = false;
      isDupMode = false;
      document.body.classList.remove('manage-mode', 'dup-mode');

      const dupBtn = document.getElementById('dupBtn');
      if (dupBtn) {
        dupBtn.classList.remove('dup-active');
        dupBtn.textContent = '중복 표시';
      }

      const manageBtn = document.getElementById('manageBtn');
      if (manageBtn) {
        manageBtn.classList.remove('manage-active');
        manageBtn.textContent = '⚙️';
      }

      Object.keys(uiState).forEach(k => {
        uiState[k].addOpen = false;
        uiState[k].editIdx = null;
        uiState[k].delMode = false;
        uiState[k].selected.clear();
      });
    }

    function openConfirmModal(title, message, confirmText, onConfirm) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      document.getElementById('modalConfirmBtn').textContent = confirmText || '확인';
      modalConfirmCallback = onConfirm;
      document.getElementById('customModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('customModal').classList.remove('open');
      modalConfirmCallback = null;
    }

    function handleModalConfirm() {
      const cb = modalConfirmCallback;
      closeModal();
      if (typeof cb === 'function') cb();
    }

    function buildZoneHtml(zoneKey, labelText, labelClass, items, zoneThemeClass = 'zone-neutral', showHeader = true) {
      const st = getZoneState(zoneKey);
      const isEditing = st.addOpen && st.editIdx !== null && items[st.editIdx];
      const currentInputVal = isEditing ? items[st.editIdx].text : '';

      const capsulesHtml = items.length === 0
        ? `<span class="empty-hint">+ 버튼으로 항목을 추가하세요</span>`
        : items.map((item, idx) => {
            const isSel = st.selected.has(idx) ? 'selected' : '';
            const isDup = item.dup ? 'is-dup' : '';
            const isEditTarget = (st.addOpen && st.editIdx === idx) ? 'editing' : '';
            return `<span class="capsule ${isDup} ${isSel} ${isEditTarget}" onclick="handleCapsuleClick('${zoneKey}', ${idx})">${escapeHtml(item.text)}</span>`;
          }).join('');

      const addBarHtml = st.addOpen ? `
        <div class="add-bar">
          <span class="edit-hint">${isEditing ? '선택된 캡슐 내용을 수정합니다' : '위 캡슐을 누르면 기존 내용을 수정할 수 있어요'}</span>
          <div class="add-bar-row">
            <input type="text" id="input_${zoneKey}" class="add-input"
              value="${escapeHtml(currentInputVal)}"
              placeholder="${isEditing ? '수정할 내용 입력 후 Enter' : '항목 입력 후 Enter'}"
              onkeydown="if(event.key==='Enter'){ event.preventDefault(); submitCapsuleItem('${zoneKey}'); }">
            <button class="btn primary" onclick="submitCapsuleItem('${zoneKey}')">${isEditing ? '수정' : '추가'}</button>
            ${isEditing ? `<button class="btn" onclick="cancelEditCapsule('${zoneKey}')">취소</button>` : ''}
          </div>
        </div>
      ` : '';

      const delBarHtml = st.delMode ? `
        <div class="del-bar">
          <span>삭제 선택</span>
          <div class="btn-group">
            <button class="btn danger" onclick="confirmDeleteSelected('${zoneKey}')">삭제(${st.selected.size})</button>
            <button class="btn" onclick="toggleDelMode('${zoneKey}')">취소</button>
          </div>
        </div>
      ` : '';

      const headerHtml = showHeader ? `
        <div class="zone-header">
          <span class="person-label ${labelClass}">${escapeHtml(labelText)}</span>
          <div class="zone-actions">
            <button class="pm-btn ${st.addOpen ? 'active-add' : ''}" title="항목 추가/수정" onclick="toggleAddBar('${zoneKey}')">+</button>
            <button class="pm-btn ${st.delMode ? 'active-del' : ''}" title="항목 선택 삭제" onclick="toggleDelMode('${zoneKey}')">−</button>
          </div>
        </div>
      ` : '';

      const modeClasses = `${zoneThemeClass} ${st.addOpen ? 'add-mode' : ''} ${st.delMode ? 'del-mode' : ''}`;

      return `
        <div class="zone-box ${modeClasses}">
          ${headerHtml}
          <div class="capsule-list">
            ${capsulesHtml}
          </div>
          ${addBarHtml}
          ${delBarHtml}
        </div>
      `;
    }

    function getTargetArray(zoneKey) {
      const parts = zoneKey.split('_');
      if (parts[0] === 'p') {
        const pIdx = Number(parts[1]);
        return appData.principles[pIdx].items;
      } else if (parts[0] === 's') {
        const sIdx = Number(parts[1]);
        const field = parts[2];
        return appData.spaces[sIdx][field];
      }
      return [];
    }

    function handleCapsuleClick(zoneKey, itemIdx) {
      const st = getZoneState(zoneKey);
      const arr = getTargetArray(zoneKey);
      if (!arr[itemIdx]) return;

      if (st.delMode) {
        if (st.selected.has(itemIdx)) {
          st.selected.delete(itemIdx);
        } else {
          st.selected.add(itemIdx);
        }
        renderAll();
        return;
      }

      if (st.addOpen) {
        st.editIdx = (st.editIdx === itemIdx) ? null : itemIdx;
        renderAll();
        setTimeout(() => {
          const inp = document.getElementById('input_' + zoneKey);
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }, 20);
        return;
      }

      if (isDupMode && zoneKey.startsWith('s_')) {
        arr[itemIdx].dup = !arr[itemIdx].dup;
        arr[itemIdx].updatedAt = Date.now();
        saveData();
        renderAll();
      }
    }

    function cancelEditCapsule(zoneKey) {
      const st = getZoneState(zoneKey);
      st.editIdx = null;
      renderAll();
      setTimeout(() => {
        const inp = document.getElementById('input_' + zoneKey);
        if (inp) inp.focus();
      }, 20);
    }

    function toggleAddBar(zoneKey) {
      const wasOpen = getZoneState(zoneKey).addOpen;
      resetAllModes();
      if (!wasOpen) {
        const st = getZoneState(zoneKey);
        st.addOpen = true;
      }
      renderAll();
      if (!wasOpen) {
        setTimeout(() => {
          const inp = document.getElementById('input_' + zoneKey);
          if (inp) inp.focus();
        }, 20);
      }
    }

    function toggleDelMode(zoneKey) {
      const wasDel = getZoneState(zoneKey).delMode;
      resetAllModes();
      if (!wasDel) {
        const st = getZoneState(zoneKey);
        st.delMode = true;
      }
      renderAll();
    }

    function submitCapsuleItem(zoneKey) {
      const inp = document.getElementById('input_' + zoneKey);
      if (!inp) return;
      const val = inp.value.trim();
      if (!val) return;

      const st = getZoneState(zoneKey);
      const arr = getTargetArray(zoneKey);

      if (st.editIdx !== null && arr[st.editIdx]) {
        arr[st.editIdx].text = val;
        arr[st.editIdx].updatedAt = Date.now();
        st.editIdx = null;
      } else {
        arr.push({
          uid: makeUid('cap'),
          text: val,
          dup: false,
          updatedAt: Date.now()
        });
      }

      saveData();
      renderAll();

      setTimeout(() => {
        const nextInp = document.getElementById('input_' + zoneKey);
        if (nextInp) nextInp.focus();
      }, 20);
    }

    function confirmDeleteSelected(zoneKey) {
      const st = getZoneState(zoneKey);
      if (st.selected.size === 0) return;

      const arr = getTargetArray(zoneKey);
      const sortedIndices = Array.from(st.selected).sort((a, b) => b - a);
      sortedIndices.forEach(idx => {
        if (arr[idx] && arr[idx].uid) {
          recordDeletion(arr[idx].uid);
        }
        arr.splice(idx, 1);
      });

      st.selected.clear();
      st.delMode = false;
      saveData();
      renderAll();
    }

    function renderAll() {
      renderPrinciples();
      renderCompareAndBuy();
    }

    function renderPrinciples() {
      const container = document.getElementById('principlesGrid');
      container.innerHTML = '';

      appData.principles.forEach((item, idx) => {
        const zoneKey = `p_${idx}`;
        const st = getZoneState(zoneKey);
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <input type="text" class="space-title-input" value="${escapeHtml(item.title)}"
              oninput="updatePrincipleTitle(${idx}, this.value)">
            <div class="zone-actions">
              <button class="pm-btn ${st.addOpen ? 'active-add' : ''}" title="항목 추가/수정" onclick="toggleAddBar('${zoneKey}')">+</button>
              <button class="pm-btn ${st.delMode ? 'active-del' : ''}" title="항목 선택 삭제" onclick="toggleDelMode('${zoneKey}')">−</button>
            </div>
          </div>
          ${buildZoneHtml(zoneKey, '', '', item.items, 'zone-neutral', false)}
        `;
        container.appendChild(card);
      });
    }

    function renderCompareAndBuy() {
      const compareGrid = document.getElementById('compareGrid');
      const buyGrid = document.getElementById('buyGrid');
      compareGrid.innerHTML = '';
      buyGrid.innerHTML = '';

      appData.spaces.forEach((space, idx) => {
        const compareCard = document.createElement('div');
        compareCard.className = 'card';
        compareCard.innerHTML = `
          <div class="card-header">
            <input type="text" class="space-title-input" value="${escapeHtml(space.name)}"
              placeholder="공간 이름"
              oninput="updateSpaceName(${idx}, this.value)">
            <div class="manage-controls">
              <button class="icon-btn" onclick="moveSpace(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button class="icon-btn" onclick="moveSpace(${idx}, 1)" ${idx === appData.spaces.length - 1 ? 'disabled' : ''}>▼</button>
              <button class="icon-btn btn danger" onclick="deleteSpace(${idx})">삭제</button>
            </div>
          </div>
          <div class="compare-box">
            ${buildZoneHtml(`s_${idx}_kkomal`, '꼬말', 'label-kkomal', space.kkomal, 'zone-kkomal', true)}
            ${buildZoneHtml(`s_${idx}_kkamgo`, '깜고', 'label-kkamgo', space.kkamgo, 'zone-kkamgo', true)}
          </div>
        `;
        compareGrid.appendChild(compareCard);

        const buyZoneKey = `s_${idx}_toBuy`;
        const buySt = getZoneState(buyZoneKey);
        const buyCard = document.createElement('div');
        buyCard.className = 'card';
        buyCard.innerHTML = `
          <div class="card-header">
            <strong class="buy-space-title" data-idx="${idx}" style="font-family:'Gowun Batang',serif; font-size:1.05rem; color:var(--deep-green); padding:2px 4px;">${escapeHtml(space.name)}</strong>
            <div class="zone-actions">
              <button class="pm-btn ${buySt.addOpen ? 'active-add' : ''}" title="항목 추가/수정" onclick="toggleAddBar('${buyZoneKey}')">+</button>
              <button class="pm-btn ${buySt.delMode ? 'active-del' : ''}" title="항목 선택 삭제" onclick="toggleDelMode('${buyZoneKey}')">−</button>
            </div>
          </div>
          ${buildZoneHtml(buyZoneKey, '', '', space.toBuy, 'zone-neutral', false)}
        `;
        buyGrid.appendChild(buyCard);
      });
    }

    function updatePrincipleTitle(idx, val) {
      appData.principles[idx].title = val;
      appData.principles[idx].updatedAt = Date.now();
      saveData();
    }

    function updateSpaceName(idx, val) {
      appData.spaces[idx].name = val;
      appData.spaces[idx].updatedAt = Date.now();
      const buyTitle = document.querySelector(`.buy-space-title[data-idx="${idx}"]`);
      if (buyTitle) buyTitle.textContent = val;
      saveData();
    }

    function addSpace() {
      resetAllModes();
      appData.spaces.push({
        id: makeUid('space'),
        name: '새로운 공간',
        updatedAt: Date.now(),
        kkomal: [],
        kkamgo: [],
        toBuy: []
      });
      appData._orderUpdatedAt = Date.now();
      renderAll();
      saveData();
    }

    function toggleDupMode() {
      const willBeActive = !isDupMode;
      resetAllModes();
      if (willBeActive) {
        isDupMode = true;
        document.body.classList.add('dup-mode');
        const btn = document.getElementById('dupBtn');
        btn.classList.add('dup-active');
        btn.textContent = '중복 표시 완료';
      }
      renderAll();
    }

    function toggleManageMode() {
      const willBeActive = !isManageMode;
      resetAllModes();
      if (willBeActive) {
        isManageMode = true;
        document.body.classList.add('manage-mode');
        const btn = document.getElementById('manageBtn');
        btn.classList.add('manage-active');
        btn.textContent = '관리 완료';
      }
      renderAll();
    }

    function moveSpace(idx, direction) {
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= appData.spaces.length) return;
      const temp = appData.spaces[idx];
      appData.spaces[idx] = appData.spaces[targetIdx];
      appData.spaces[targetIdx] = temp;
      appData._orderUpdatedAt = Date.now();
      renderCompareAndBuy();
      saveData();
    }

    function deleteSpace(idx) {
      const space = appData.spaces[idx];
      openConfirmModal(
        '공간 삭제',
        `'${space.name}' 공간을 삭제할까요? 탭의 카드도 함께 삭제됩니다.`,
        '삭제',
        () => {
          recordDeletion(space.id);
          appData.spaces.splice(idx, 1);
          appData._orderUpdatedAt = Date.now();
          renderCompareAndBuy();
          saveData();
        }
      );
    }

    function switchTab(tabId, btnEl) {
      resetAllModes();
      renderAll();
      document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      btnEl.classList.add('active');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
    }
  </script>
